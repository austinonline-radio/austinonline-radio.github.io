<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Austin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Austin Radio Online</title>
<style>
:root{--bg:#0F0F12;--surface:#1E1E24;--primary:#FF2D3A;--primary-hover:#E6232E;--accent:#FF6B35;--text:#F4F4F5;--muted:#A8A8B3;--border:#2A2A32;
color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:120px;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:20px}

/* Encabezado: Logo a la izquierda y Clima a la derecha */
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.header-brand{display:flex;align-items:center;gap:8px}
.header-logo-text{font-weight:900;font-size:20px;letter-spacing:-0.5px;line-height:1;text-transform:lowercase}
.header-tag{display:inline-block;background:var(--accent);color:#0F0F12;font-weight:800;font-size:10px;padding:2px 6px;border-radius:3px;transform:rotate(-3deg)}

.wxh{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.wxh[hidden]{display:none}

/* Sección Central: Ecualizador + Logo principal */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0 30px;text-align:center}
.equalizer-icon{width:140px;height:90px;margin-bottom:20px}
.brand-main{display:flex;flex-direction:column;align-items:center;gap:8px}
.logo-text{font-weight:900;font-size:42px;letter-spacing:-1.5px;line-height:1;text-transform:lowercase}
.tag{display:inline-block;background:var(--accent);color:#0F0F12;font-weight:800;font-size:14px;padding:4px 12px;border-radius:4px;transform:rotate(-3deg)}

/* Widgets e Información */
.wx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.wx[hidden]{display:none}
.wx-d{font-size:14px}.wx-c{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.item b{color:var(--accent);min-width:52px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1;min-width:130px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--text);border-radius:12px;padding:12px;font-size:14px;font-weight:600}
.btn.wa{background:var(--primary);border-color:var(--primary)}

/* Reproductor Fijo en la parte Inferior */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;z-index:1000;box-shadow:0 -5px 20px rgba(0,0,0,.5)}
.player-container{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.player-main{display:flex;align-items:center;gap:12px}

#play{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(255,45,58,.4);transition:transform .15s}
#play:active{transform:scale(.95)}
#play svg{width:24px;height:24px;fill:currentColor}
#pause-i{display:none}.on #pause-i{display:block}.on #play-i{display:none}

.player-info{flex:1;min-width:0}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,58,.6)}100%{box-shadow:0 0 0 8px rgba(255,45,58,0)}}
.on .live-badge{color:var(--text)}

#status{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np[hidden]{display:none}

.controls-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--primary);height:4px}
.chips{display:flex;gap:6px}
.chip{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:3px 8px;font-size:11px;cursor:pointer}
.chip.sel{border-color:var(--accent);color:var(--accent)}

footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <!-- Logo en la cabecera (izquierda) -->
    <div class="header-brand">
      <span class="header-logo-text">austin</span>
      <span class="header-tag">radio online</span>
    </div>
    <!-- Widget del clima (derecha) -->
    <button class="wxh" id="wxh" type="button" hidden aria-expanded="false" aria-controls="wx"><span id="wxh-i"></span><span id="wxh-t"></span></button>
  </header>

  <div class="wx" id="wx" hidden aria-live="polite">
    <div class="wx-d" id="wx-d"></div><div class="wx-c" id="wx-c"></div>
  </div>

  <!-- Barra de sonido naranja ARRIBA y Marca AUSTIN ABAJO -->
  <div class="hero">
    <svg class="equalizer-icon" viewBox="0 0 46 38" aria-hidden="true">
      <g fill="#FF6B35">
        <rect x="0" y="22" width="5" height="16" rx="2"/>
        <rect x="7" y="14" width="5" height="24" rx="2"/>
        <rect x="14" y="6" width="5" height="32" rx="2"/>
        <rect x="21" y="0" width="5" height="38" rx="2"/>
        <rect x="28" y="8" width="5" height="30" rx="2"/>
        <rect x="35" y="16" width="5" height="22" rx="2"/>
        <rect x="42" y="24" width="4" height="14" rx="2"/>
      </g>
    </svg>
    <div class="brand-main">
      <span class="logo-text">austin</span>
      <span class="tag">radio online</span>
    </div>
  </div>

  <h2>Programación</h2>
  <div id="sched"></div>

  <h2>Contacto</h2>
  <div id="contact"></div>

  <footer>© Austin Radio Online · Clima: <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:inherit">Open-Meteo.com</a></footer>
</div>

<!-- Reproductor Inferior Fijo -->
<div class="player-bar">
  <div class="player-container">
    <div class="player-main">
      <button id="play" aria-label="Escuchar en vivo">
        <svg id="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="player-info">
        <div class="live-badge"><span class="dot"></span>EN VIVO</div>
        <p id="status">Tocá para escuchar</p>
        <p class="np" id="np" hidden></p>
      </div>
    </div>
    <div class="controls-row">
      <span>Vol.</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen">
      <div class="chips" id="sleep"></div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  streams: [
    'https://uk18freenew.listen2myradio.com/live.mp3?typeportmount=ice_30563_stream_511390628',
    'https://uk18freenew.listen2myradio.com/live.mp3?typeportmount=ice_7357_stream_793515056'
  ],
  whatsapp: '',
  instagram: '',
  facebook: '',
  schedule: [],
  nowPlaying: [
    'https://austinonline.pablocgonzalezcde.workers.dev/api',
    'https://austinonline.pablocgonzalezcde.workers.dev/'
  ],
  weather: { city: 'Cruz del Eje', lat: -30.7256, lon: -64.8067 }
};

const $ = (id) => document.getElementById(id);
let audio = new Audio();
let idx = 0, playing = false, retries = 0, sleepTimer = null, npTimer = null, lastTitle = '';

function setStatus(t) { $('status').textContent = t; }
function paint() {
  document.body.classList.toggle('on', playing);
  $('play').setAttribute('aria-label', playing ? 'Pausar' : 'Escuchar en vivo');
}

function start() {
  playing = true; 
  paint(); 
  setStatus('Conectando…');
  
  if (!audio) {
    audio = new Audio();
  }
  
  audio.src = CONFIG.streams[idx];
  audio.crossOrigin = 'anonymous';
  
  audio.play().catch(() => {
    fail();
  });
}

function stop(msg) {
  playing = false;
  stopTitlePolling();
  if (audio) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
  }
  paint(); 
  setStatus(msg || 'Tocá para escuchar');
}

function fail() {
  if (!playing) return;
  if (idx < CONFIG.streams.length - 1) { 
    idx++; 
    start(); 
    return; 
  }
  if (retries < 2) { 
    retries++; 
    idx = 0; 
    setTimeout(() => playing && start(), 1500); 
    return; 
  }
  retries = 0; 
  idx = 0; 
  stop('No se pudo conectar. Probá de nuevo.');
}

audio.addEventListener('playing', () => {
  retries = 0; 
  setStatus('Escuchando en vivo');
  if (!npTimer && CONFIG.nowPlaying && CONFIG.nowPlaying.length) startTitlePolling();
});
audio.addEventListener('waiting', () => playing && setStatus('Conectando…'));
audio.addEventListener('error', fail);

$('play').addEventListener('click', () => (playing ? stop() : start()));
$('vol').addEventListener('input', (e) => { if(audio) audio.volume = e.target.value / 100; });

// AUTOPLAY AL CARGAR LA PÁGINA
window.addEventListener('load', () => {
  setTimeout(() => {
    start();
  }, 500);
});

// Si el navegador bloquea el autoplay por políticas de audio, iniciará al primer toque en la pantalla
document.addEventListener('click', function initAudio() {
  if (!playing && audio.paused) {
    start();
  }
  document.removeEventListener('click', initAudio);
}, { once: true });

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Austin Radio Online', artist: 'En vivo',
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', start);
  navigator.mediaSession.setActionHandler('pause', () => stop());
}

[15, 30, 60].forEach((m) => {
  const b = document.createElement('button');
  b.className = 'chip'; 
  b.textContent = m + 'm';
  b.onclick = () => {
    const was = b.classList.contains('sel');
    clearTimeout(sleepTimer);
    document.querySelectorAll('.chip').forEach((c) => c.classList.remove('sel'));
    if (was) return;
    b.classList.add('sel');
    sleepTimer = setTimeout(() => {
      stop('Apagado automático');
      b.classList.remove('sel');
    }, m * 60000);
  };
  $('sleep').appendChild(b);
});

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('sched').innerHTML = CONFIG.schedule.length
  ? CONFIG.schedule.map((s) => `<div class="item"><b>${esc(s.time)}</b><span>${esc(s.name)}</span></div>`).join('')
  : '<p class="empty">La programación se publica pronto.</p>';

const links = [];
if (CONFIG.whatsapp) links.push(`<a class="btn wa" href="https://wa.me/${esc(CONFIG.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`);
if (CONFIG.instagram) links.push(`<a class="btn" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
if (CONFIG.facebook) links.push(`<a class="btn" href="${esc(CONFIG.facebook)}" target="_blank" rel="noopener">Facebook</a>`);
$('contact').innerHTML = links.length ? `<div class="btns">${links.join('')}</div>` : '<p class="empty">Muy pronto vas a poder escribirnos desde acá.</p>';

function pickTitle(d) {
  if (typeof d === 'string') return /^\s*</.test(d) ? '' : d.trim();
  if (!d || typeof d !== 'object') return '';
  if (d.icestats) {
    let src = d.icestats.source;
    if (Array.isArray(src)) {
      src = src.find((x) => /stream/.test(x.listenurl || '') && (x.title || x.yp_currently_playing)) || src.find((x) => x.title || x.yp_currently_playing);
    }
    return src ? String(src.title || src.yp_currently_playing || '').trim() : '';
  }
  const v = d.songtitle || d.title || d.song || d.current_song || d.nowplaying || d.now_playing || d.text;
  if (typeof v === 'string') return v.trim();
  return v && typeof v === 'object' ? pickTitle(v) : '';
}

function showTitle(t) {
  t = (t || '').replace(/\s+/g, ' ').trim().slice(0, 140);
  if (t === lastTitle) return;
  lastTitle = t;
  $('np').textContent = t ? '♪ ' + t : '';
  $('np').hidden = !t;
}

async function fetchTitle() {
  for (const u of CONFIG.nowPlaying || []) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const txt = await r.text();
      let d = txt;
      try { d = JSON.parse(txt); } catch (e) {}
      const t = pickTitle(d);
      if (t) { showTitle(t); return; }
    } catch (e) {}
  }
}

function startTitlePolling() { clearInterval(npTimer); fetchTitle(); npTimer = setInterval(fetchTitle, 20000); }
function stopTitlePolling() { clearInterval(npTimer); npTimer = null; showTitle(''); }

const WX = (c) => c === 0 ? ['☀️', 'Despejado'] : c === 1 ? ['🌤️', 'Mayormente despejado'] : c === 2 ? ['⛅', 'Parcialmente nublado'] : c === 3 ? ['☁️', 'Nublado']
  : (c === 45 || c === 48) ? ['🌫️', 'Niebla'] : (c >= 51 && c <= 57) ? ['🌦️', 'Llovizna']
  : ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) ? ['🌧️', 'Lluvia']
  : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? ['🌨️', 'Nieve'] : c >= 95 ? ['⛈️', 'Tormenta'] : ['🌡️', 'Clima'];

async function loadWeather() {
  const w = CONFIG.weather;
  if (!w) return;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
      '&current=temperature_2m,weather_code,relative_humidity_2m' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=auto';
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const cur = d.current, day = d.daily;
    const [icon, text] = WX(cur.weather_code);
    $('wxh-i').textContent = icon;
    $('wxh-t').textContent = Math.round(cur.temperature_2m) + '°';
    $('wx-d').textContent = w.city + ' · ' + text;
    $('wx-c').innerHTML = 'Máx ' + Math.round(day.temperature_2m_max[0]) + '° · Mín ' + Math.round(day.temperature_2m_min[0]) +
      '° · Lluvia ' + day.precipitation_probability_max[0] + '% · Humedad ' + cur.relative_humidity_2m + '%';
    $('wxh').hidden = false;
  } catch (e) {}
}

$('wxh').addEventListener('click', () => {
  const p = $('wx');
  p.hidden = !p.hidden;
  $('wxh').setAttribute('aria-expanded', String(!p.hidden));
});

loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
