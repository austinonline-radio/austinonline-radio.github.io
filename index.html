<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Austin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Austin Radio Online</title>
<style>
:root{--bg:#0F0F12;--surface:#1E1E24;--primary:#FF2D3A;--primary-hover:#E6232E;--accent:#FF6B35;--text:#F4F4F5;--muted:#A8A8B3;--border:#2A2A32;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:20px 20px 40px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 24px}
.logo-text{font-weight:900;font-size:30px;letter-spacing:-1px;line-height:1}
.tag{display:inline-block;background:var(--accent);color:#0F0F12;font-weight:800;font-size:12px;padding:3px 9px;border-radius:4px;transform:rotate(-4deg);margin-left:6px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 20px;text-align:center}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,58,.6)}100%{box-shadow:0 0 0 10px rgba(255,45,58,0)}}
.on .live{color:var(--text)}
#play{margin:26px auto 14px;width:116px;height:116px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(255,45,58,.35);transition:transform .15s,background .15s}
#play:hover{background:var(--primary-hover)}#play:active{transform:scale(.95)}
#play:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#play svg{width:48px;height:48px;fill:currentColor}
#pause-i{display:none}.on #pause-i{display:block}.on #play-i{display:none}
#status{font-size:15px;min-height:22px;color:var(--text)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;margin-top:24px;color:var(--muted);font-size:13px}
input[type=range]{flex:1;accent-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.wx{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 18px;margin-top:16px}
.wx[hidden]{display:none}
.wx-i{font-size:38px;line-height:1}.wx-t{font-size:28px;font-weight:800;line-height:1}
.wx-d{font-size:14px;margin-top:4px}.wx-c{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.wx a{color:var(--muted)}
h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.item b{color:var(--accent);min-width:52px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1;min-width:130px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--text);border-radius:12px;padding:12px;font-size:14px;font-weight:600}
.btn.wa{background:var(--primary);border-color:var(--primary)}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <svg width="46" height="38" viewBox="0 0 46 38" aria-hidden="true">
      <g fill="#FF2D3A"><rect x="0" y="22" width="5" height="16" rx="2"/><rect x="7" y="14" width="5" height="24" rx="2"/><rect x="14" y="6" width="5" height="32" rx="2"/><rect x="21" y="0" width="5" height="38" rx="2" fill="#FF6B35"/><rect x="28" y="8" width="5" height="30" rx="2"/><rect x="35" y="16" width="5" height="22" rx="2"/><rect x="42" y="24" width="4" height="14" rx="2"/></g>
    </svg>
    <div><span class="logo-text">austin</span><span class="tag">radio online</span></div>
  </header>

  <section class="card" aria-label="Reproductor">
    <div class="live"><span class="dot"></span>EN VIVO</div>
    <button id="play" aria-label="Escuchar en vivo">
      <svg id="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <p id="status" role="status">Tocá para escuchar</p>
    <p class="sub" id="sleepinfo">Donde vive la música</p>
    <div class="row"><span>Volumen</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen"></div>
    <div class="chips" id="sleep"><span class="sub" style="width:100%;margin:0">Apagar en</span></div>
  </section>

  <div class="wx" id="wx" hidden aria-live="polite">
    <div class="wx-i" id="wx-i"></div>
    <div><div class="wx-t" id="wx-t"></div><div class="wx-d" id="wx-d"></div><div class="wx-c" id="wx-c"></div></div>
  </div>

  <h2>Programación</h2>
  <div id="sched"></div>

  <h2>Contacto</h2>
  <div id="contact"></div>

  <footer>© Austin Radio Online</footer>
</div>

<script>
// ===== Completá estos datos =====
const CONFIG = {
  streams: [
    'https://uk18freenew.listen2myradio.com/live.mp3?typeportmount=ice_7357_stream_793515056',
    'https://sapircast.caster.fm:15227/lOysa' // respaldo si el primero falla
  ],
  whatsapp: '',   // solo números con código de país, ej: 5493541000000
  instagram: '',  // URL completa
  facebook: '',   // URL completa
  schedule: [],   // ej: [{ time: '08:00', name: 'Buen día Austin' }]
  weather: { city: 'Cruz del Eje', lat: -30.7256, lon: -64.8067 } // poné null para ocultar el clima
};
// =================================

const $ = (id) => document.getElementById(id);
const audio = new Audio();
audio.preload = 'none';
let idx = 0, playing = false, retries = 0, sleepTimer = null;

function setStatus(t) { $('status').textContent = t; }
function paint() {
  $('app').classList.toggle('on', playing);
  $('play').setAttribute('aria-label', playing ? 'Pausar' : 'Escuchar en vivo');
}
function start() {
  playing = true; paint(); setStatus('Conectando…');
  audio.src = CONFIG.streams[idx];
  audio.play().catch(fail);
}
function stop(msg) {
  playing = false;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  paint(); setStatus(msg || 'Tocá para escuchar');
}
function fail() {
  if (!playing) return;
  if (idx < CONFIG.streams.length - 1) { idx++; start(); return; }
  if (retries < 2) { retries++; idx = 0; setTimeout(() => playing && start(), 1500); return; }
  retries = 0; idx = 0; stop('No se pudo conectar. Probá de nuevo.');
}
audio.addEventListener('playing', () => { retries = 0; setStatus('Escuchando en vivo'); });
audio.addEventListener('waiting', () => playing && setStatus('Conectando…'));
audio.addEventListener('error', fail);
$('play').addEventListener('click', () => (playing ? stop() : start()));
$('vol').addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
audio.volume = 0.8;

// Controles en la pantalla de bloqueo
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Austin Radio Online', artist: 'En vivo',
    artwork: [{ src: 'icon.svg', sizes: '512x512', type: 'image/svg+xml' }]
  });
  navigator.mediaSession.setActionHandler('play', start);
  navigator.mediaSession.setActionHandler('pause', () => stop());
}

// Temporizador para dormir
[15, 30, 60].forEach((m) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = m + ' min';
  b.onclick = () => {
    const was = b.classList.contains('sel');
    clearTimeout(sleepTimer);
    document.querySelectorAll('.chip').forEach((c) => c.classList.remove('sel'));
    $('sleepinfo').textContent = 'Donde vive la música';
    if (was) return;
    b.classList.add('sel');
    $('sleepinfo').textContent = 'Se apaga en ' + m + ' minutos';
    sleepTimer = setTimeout(() => {
      stop('Apagado automático');
      b.classList.remove('sel'); $('sleepinfo').textContent = 'Donde vive la música';
    }, m * 60000);
  };
  $('sleep').appendChild(b);
});

// Programación
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('sched').innerHTML = CONFIG.schedule.length
  ? CONFIG.schedule.map((s) => `<div class="item"><b>${esc(s.time)}</b><span>${esc(s.name)}</span></div>`).join('')
  : '<p class="empty">La programación se publica pronto.</p>';

// Contacto
const links = [];
if (CONFIG.whatsapp) links.push(`<a class="btn wa" href="https://wa.me/${esc(CONFIG.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`);
if (CONFIG.instagram) links.push(`<a class="btn" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
if (CONFIG.facebook) links.push(`<a class="btn" href="${esc(CONFIG.facebook)}" target="_blank" rel="noopener">Facebook</a>`);
$('contact').innerHTML = links.length ? `<div class="btns">${links.join('')}</div>` : '<p class="empty">Muy pronto vas a poder escribirnos desde acá.</p>';

// Clima (Open-Meteo)
const WX = (c) => c === 0 ? ['☀️', 'Despejado'] : c === 1 ? ['🌤️', 'Mayormente despejado'] : c === 2 ? ['⛅', 'Parcialmente nublado'] : c === 3 ? ['☁️', 'Nublado']
  : (c === 45 || c === 48) ? ['🌫️', 'Niebla'] : (c >= 51 && c <= 57) ? ['🌦️', 'Llovizna']
  : ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) ? ['🌧️', 'Lluvia']
  : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? ['🌨️', 'Nieve'] : c >= 95 ? ['⛈️', 'Tormenta'] : ['🌡️', 'Clima'];
async function loadWeather() {
  const w = CONFIG.weather;
  if (!w) return;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
      '&current=temperature_2m,weather_code,relative_humidity_2m' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=auto';
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const cur = d.current, day = d.daily;
    const [icon, text] = WX(cur.weather_code);
    $('wx-i').textContent = icon;
    $('wx-t').textContent = Math.round(cur.temperature_2m) + '°C';
    $('wx-d').textContent = w.city + ' · ' + text;
    $('wx-c').innerHTML = 'Máx ' + Math.round(day.temperature_2m_max[0]) + '° · Mín ' + Math.round(day.temperature_2m_min[0]) +
      '° · Lluvia ' + day.precipitation_probability_max[0] + '% · Humedad ' + cur.relative_humidity_2m + '%<br>' +
      '<a href="https://open-meteo.com/" target="_blank" rel="noopener">Datos del clima: Open-Meteo.com</a>';
    $('wx').hidden = false;
  } catch (e) { /* si falla, la tarjeta queda oculta */ }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
