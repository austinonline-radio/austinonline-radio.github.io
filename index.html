<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<meta name="description" content="Austin Radio Online: escuchá la radio en vivo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Austin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Austin Radio Online</title>
<style>
:root{--bg:#0F0F12;--surface:#1E1E24;--primary:#FF2D3A;--primary-hover:#E6232E;--accent:#FF2D3A;--text:#F4F4F5;--muted:#A8A8B3;--border:#2A2A32;
color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(140px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:20px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Encabezado */
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px;min-height:54px}
.header-mark{height:30px;width:auto;display:block}

.wxh{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.wxh[hidden]{display:none}

/* Sección Central */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 28px;text-align:center}
.hero-logo{width:min(64vw,250px);height:auto;display:block}

/* Widgets */
.wx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.wx[hidden]{display:none}
.wx-d{font-size:14px}.wx-c{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px}
h2[hidden]{display:none}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.item b{color:var(--accent);min-width:52px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}

/* Tarjeta de apoyo (carrusel: los controles aparecen solo si hay más de un anuncio) */
.ads-wrapper{margin:24px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.ads-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#15151A;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);font-weight:700;min-height:34px}
.ads-nav-btns{display:flex;gap:6px}
.ads-nav-btns[hidden]{display:none}
.ads-nav-btn{background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:4px}
.ads-nav-btn:hover{color:#fff;background:var(--border)}

.slider-container{position:relative;width:100%;min-height:150px;overflow:hidden}
.slide{display:none;padding:18px;text-align:center;animation:fade .5s ease-in-out}
.slide.active{display:block}

@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

/* Anuncio: Donación */
.slide-donate{background:linear-gradient(135deg, #1E1E24 0%, #2A1A1E 100%)}
.support-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
.support-desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.support-prices{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.price-tag{background:rgba(255,45,58,0.15);border:1px solid rgba(255,45,58,0.3);color:var(--primary);font-weight:700;font-size:12px;padding:3px 8px;border-radius:20px}
.support-btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 18px;border-radius:10px}

.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1;min-width:130px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--text);border-radius:12px;padding:12px;font-size:14px;font-weight:600}
.btn.wa{background:var(--primary);border-color:var(--primary)}

/* Reproductor Fijo */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:1000;box-shadow:0 -5px 20px rgba(0,0,0,.5)}
.player-container{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.player-main{display:flex;align-items:center;gap:12px}

.cover-box{width:48px;height:48px;min-width:48px;border-radius:8px;overflow:hidden;background:#2A2A32;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.cover-box img{width:100%;height:100%;object-fit:cover;display:block}

#play{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(255,45,58,.4);transition:transform .15s}
#play:active{transform:scale(.95)}
#play svg{width:24px;height:24px;fill:currentColor}
#pause-i{display:none}.on #pause-i{display:block}.on #play-i{display:none}

.player-info{flex:1;min-width:0}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,58,.6)}100%{box-shadow:0 0 0 8px rgba(255,45,58,0)}}
.on .live-badge{color:var(--text)}

#status{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.np[hidden]{display:none}

.controls-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--primary);height:4px;min-width:60px}
.chips{display:flex;gap:6px}
.chip{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--accent);color:var(--accent)}

footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  .slide{animation:none}
  .on .dot{animation:none}
  #play{transition:none}
}
</style>
</head>

<div class="player-bar">
  <div class="player-container">
    <div class="player-main">
      <div class="cover-box">
        <img id="cover-img" src="icon-512.png" alt="Portada" onerror="this.onerror=null;this.src='icon-512.png';">
      </div>
      <button id="play" aria-label="Escuchar en vivo">
        <svg id="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="player-info">

      <span>Vol.</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen">
      <div class="chips" id="sleep" role="group" aria-label="Temporizador para dormir"></div>

<script>
const CONFIG = {
  streams: ['https://srv1.streamingradio.ar/8062/stream'],
  statsApi: 'https://srv1.streamingradio.ar/cp/get_info.php?p=8062',
  // Contacto: completá lo que quieras mostrar (el bloque "Contacto" aparece solo si hay algo).
  // whatsapp: solo números con código de país, ej. '5493541000000'. instagram/tiktok/facebook: usuario o link completo.
  whatsapp: '', instagram: 'https://www.instagram.com/austinradiook', tiktok: 'https://www.tiktok.com/@austinradiook', facebook: '', schedule: [],
  sleepMinutes: [15, 30, 60],
  weather: { city: 'Cruz del Eje', lat: -30.7256, lon: -64.8067 }
};

const $ = (id) => document.getElementById(id);
let audio = new Audio(), playing = false, retries = 0, sleepTimer = null, sleepSel = null, npTimer = null, lastTitle = '';
audio.volume = $('vol').value / 100;   // que el volumen real coincida con la barra desde el inicio

function setStatus(t) { $('status').textContent = t; }
function paint() {
  document.body.classList.toggle('on', playing);
  $('play').setAttribute('aria-label', playing ? 'Pausar' : 'Escuchar en vivo');
}

/* Controles desde la pantalla de bloqueo / auriculares */
function setMediaSession(title) {
  if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title || 'En vivo',
    artist: 'Austin Radio Online',
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
  });
}
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => { if (!playing) start(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (playing) stop(); });
    navigator.mediaSession.setActionHandler('stop', () => { if (playing) stop(); });
  } catch (e) {}
}

function start() {
  playing = true; paint(); setStatus('Conectando…');
  if (!audio) audio = new Audio();
  audio.src = CONFIG.streams[0];
  audio.play().catch(() => fail());
  setMediaSession(lastTitle);
}

function stop(msg) {
  playing = false; stopTitlePolling(); clearSleep();
  if (audio) { audio.pause(); audio.removeAttribute('src'); audio.load(); }
  paint(); setStatus(msg || 'Tocá para escuchar');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
}

function fail() {
  if (!playing) return;
  if (retries < 2) { retries++; setTimeout(() => playing && start(), 1500); return; }
  retries = 0; stop('No se pudo conectar. Probá de nuevo.');
}

audio.addEventListener('playing', () => {
  retries = 0; setStatus('Escuchando en vivo');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  if (!npTimer) startTitlePolling();
});
audio.addEventListener('waiting', () => playing && setStatus('Conectando…'));
audio.addEventListener('error', fail);
audio.addEventListener('ended', fail);   // si el servidor corta la transmisión, reintenta

$('play').addEventListener('click', () => (playing ? stop() : start()));
$('vol').addEventListener('input', (e) => { if (audio) audio.volume = e.target.value / 100; });

/* TEMPORIZADOR PARA DORMIR */
function clearSleep() {
  clearTimeout(sleepTimer); sleepTimer = null; sleepSel = null;
  document.querySelectorAll('#sleep .chip').forEach((c) => c.classList.remove('sel'));
}
function setSleep(min, chip) {
  if (sleepSel === min) { clearSleep(); return; }          // tocar de nuevo lo cancela
  clearSleep();
  sleepSel = min; chip.classList.add('sel');
  sleepTimer = setTimeout(() => { if (playing) stop('Temporizador finalizado'); else clearSleep(); }, min * 60 * 1000);
}
(CONFIG.sleepMinutes || []).forEach((m) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = m + ' min';
  b.setAttribute('aria-label', 'Apagar en ' + m + ' minutos');
  b.addEventListener('click', () => setSleep(m, b));
  $('sleep').appendChild(b);
});

/* CARRUSEL DE ANUNCIOS: con un solo anuncio no se muestran flechas ni rotación */
let currentSlide = 0;
const slides = document.querySelectorAll('.slide');
let slideInterval = null;

function showSlide(index) {
  slides.forEach((s) => s.classList.remove('active'));
  currentSlide = (index + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
  if (slides.length > 1) $('adCounter').textContent = `Anuncio Publicitario · [${currentSlide + 1}/${slides.length}]`;
}
function nextSlide() { showSlide(currentSlide + 1); }
function prevSlide() { showSlide(currentSlide - 1); }

if (slides.length > 1) {
  $('adNav').hidden = false;
  $('adPrev').addEventListener('click', prevSlide);
  $('adNext').addEventListener('click', nextSlide);
  const container = $('adsContainer');
  const startRotation = () => { clearInterval(slideInterval); slideInterval = setInterval(nextSlide, 6000); };
  const stopRotation = () => clearInterval(slideInterval);
  container.addEventListener('mouseenter', stopRotation);
  container.addEventListener('mouseleave', startRotation);
  container.addEventListener('focusin', stopRotation);
  container.addEventListener('focusout', startRotation);
  showSlide(0); startRotation();
}

/* PROGRAMACIÓN Y CONTACTO */
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('sched').innerHTML = CONFIG.schedule.length
  ? CONFIG.schedule.map((s) => `<div class="item"><b>${esc(s.time)}</b><span>${esc(s.name)}</span></div>`).join('')
  : '<p class="empty">La programación se publica pronto.</p>';

(function renderContact() {
  const link = (v, base) => /^https?:\/\//i.test(v) ? v : base + String(v).replace(/^@/, '');
  const items = [];
  if (CONFIG.whatsapp) items.push(['WhatsApp', 'https://wa.me/' + String(CONFIG.whatsapp).replace(/\D/g, '') + '?text=' + encodeURIComponent('Hola! Vengo desde Austin Radio Online'), 'wa']);
  if (CONFIG.instagram) items.push(['Instagram', link(CONFIG.instagram, 'https://instagram.com/'), '']);
  if (CONFIG.tiktok) items.push(['TikTok', link(CONFIG.tiktok, 'https://www.tiktok.com/@'), '']);
  if (CONFIG.facebook) items.push(['Facebook', link(CONFIG.facebook, 'https://facebook.com/'), '']);
  if (!items.length) return;
  $('contact-h').hidden = false;
  $('contact').innerHTML = items.map(([n, u, c]) => `<a class="btn ${c}" href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join('');
})();

/* TEMA EN VIVO */
function showTitle(t, coverUrl) {
  t = (t || '').replace(/\s+/g, ' ').trim().slice(0, 140);
  if (t !== lastTitle) {
    lastTitle = t;
    $('np').textContent = t ? '♪ ' + t : '';
    $('np').hidden = !t;
    if (playing) setMediaSession(t);
  }
  if (coverUrl && (coverUrl.startsWith('http') || coverUrl === 'icon-512.png')) $('cover-img').src = coverUrl;
}

async function fetchTitle() {
  try {
    const r = await fetch(CONFIG.statsApi, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    let songTitle = d.title || d.songtitle || d.nowplaying || d.song || '';
    let coverArt = d.art || d.cover || d.image || '';
    if (songTitle) showTitle(songTitle, coverArt);
  } catch (e) {}
}

function startTitlePolling() { clearInterval(npTimer); fetchTitle(); npTimer = setInterval(fetchTitle, 10000); }
function stopTitlePolling() { clearInterval(npTimer); npTimer = null; showTitle('', 'icon-512.png'); }

/* CLIMA */
const WX = (c) => c === 0 ? ['☀️', 'Despejado'] : c === 1 ? ['🌤️', 'Mayormente despejado'] : c === 2 ? ['⛅', 'Parcialmente nublado'] : c === 3 ? ['☁️', 'Nublado']
  : (c === 45 || c === 48) ? ['🌫️', 'Niebla'] : (c >= 51 && c <= 57) ? ['🌦️', 'Llovizna']
  : ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) ? ['🌧️', 'Lluvia']
  : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? ['🌨️', 'Nieve'] : c >= 95 ? ['⛈️', 'Tormenta'] : ['🌡️', 'Clima'];

async function loadWeather() {
  const w = CONFIG.weather;
  if (!w) return;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
      '&current=temperature_2m,weather_code,relative_humidity_2m' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=auto';
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const cur = d.current, day = d.daily;
    const [icon, text] = WX(cur.weather_code);
    $('wxh-i').textContent = icon;
    $('wxh-t').textContent = Math.round(cur.temperature_2m) + '°';
    $('wx-d').textContent = w.city + ' · ' + text;
    $('wx-c').innerHTML = 'Máx ' + Math.round(day.temperature_2m_max[0]) + '° · Mín ' + Math.round(day.temperature_2m_min[0]) +
      '° · Lluvia ' + day.precipitation_probability_max[0] + '% · Humedad ' + cur.relative_humidity_2m + '%';
    $('wxh').hidden = false;
  } catch (e) {}
}

$('wxh').addEventListener('click', () => {
  const p = $('wx');
  p.hidden = !p.hidden;
  $('wxh').setAttribute('aria-expanded', String(!p.hidden));
});

loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>
