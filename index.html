<title>Austin Radio Online</title>
<style>
:root{--bg:#0F0F12;--surface:#1E1E24;--primary:#FF2D3A;--primary-hover:#E6232E;--accent:#FF2D3A;--text:#F4F4F5;--muted:#A8A8B3;--border:#2A2A32;
color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(140px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:20px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Encabezado */
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px;min-height:54px}
.header-mark{height:30px;width:auto;display:block}

.wxh{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.wxh[hidden]{display:none}

/* Sección Central */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 28px;text-align:center}
.hero-logo{width:min(64vw,250px);height:auto;display:block}

/* Widgets */
.wx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.wx[hidden]{display:none}
.wx-d{font-size:14px}.wx-c{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px}
h2[hidden]{display:none}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.item b{color:var(--accent);min-width:52px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}

/* Tarjeta de apoyo (carrusel) */
.ads-wrapper{margin:24px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.ads-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#15151A;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);font-weight:700;min-height:34px}
.ads-nav-btns{display:flex;gap:6px}
.ads-nav-btns[hidden]{display:none}
.ads-nav-btn{background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:4px}
.ads-nav-btn:hover{color:#fff;background:var(--border)}

.slider-container{position:relative;width:100%;min-height:150px;overflow:hidden}
.slide{display:none;padding:18px;text-align:center;animation:fade .5s ease-in-out}
.slide.active{display:block}

@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

/* Anuncio: Donación */
.slide-donate{background:linear-gradient(135deg, #1E1E24 0%, #2A1A1E 100%)}
.support-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
.support-desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.support-prices{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.price-tag{background:rgba(255,45,58,0.15);border:1px solid rgba(255,45,58,0.3);color:var(--primary);font-weight:700;font-size:12px;padding:3px 8px;border-radius:20px}
.support-btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 18px;border-radius:10px}

/* Botones de Redes Sociales */
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;font-weight:600;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--primary);background:rgba(255,45,58,0.05)}
.btn.wa{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.wa:hover{background:var(--primary-hover)}
.btn svg{width:18px;height:18px;fill:currentColor}

/* Reproductor Fijo */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:1000;box-shadow:0 -5px 20px rgba(0,0,0,.5)}
.player-container{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.player-main{display:flex;align-items:center;gap:12px}

.cover-box{width:48px;height:48px;min-width:48px;border-radius:8px;overflow:hidden;background:#2A2A32;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.cover-box img{width:100%;height:100%;object-fit:cover;display:block}

#play{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(255,45,58,.4);transition:transform .15s}
#play:active{transform:scale(.95)}
#play svg{width:24px;height:24px;fill:currentColor}
#pause-i{display:none}.on #pause-i{display:block}.on #play-i{display:none}

.player-info{flex:1;min-width:0}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,58,.6)}100%{box-shadow:0 0 0 8px rgba(255,45,58,0)}}
.on .live-badge{color:var(--text)}

#status{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.np[hidden]{display:none}

.controls-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--primary);height:4px;min-width:60px}
.chips{display:flex;gap:6px}
.chip{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--accent);color:var(--accent)}

footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  .slide{animation:none}
  .on .dot{animation:none}
  #play{transition:none}
}
</style>
</head>

        <svg id="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-i" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="player-info">
        <div class="live-badge"><span class="dot"></span> EN VIVO</div>
        <div id="status">Austin Online</div>
        <div class="np" id="np" hidden></div>
      </div>
    </div>
    <div class="controls-row">
      <span id="vol-icon">🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
      <div class="chips" id="chips">
        <button class="chip sel" data-bitrate="auto">HQ</button>
      </div>
    </div>
  </div>
</div>

</body>
